name: monopoly

services:
  monopoly:
    container_name: monopoly
    build: ..
    image: monopoly:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    ports:
      - "127.0.0.1:3500:5000"
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: https://mono.dvachini.cc
